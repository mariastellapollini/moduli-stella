<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bussola Interna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#faf6ee;
    --beige:#ead9c5;
    --beige-soft:#f1e6d6;
    --brown:#4a3527;
    --brown-deep:#55402e;
    --rule:#d9c6ac;
    --rose:#a9647a;
    --sage:#6f8f6a;
    --ochre:#b3822f;
    --muted:#7a6754;
    --max:720px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--cream);}
  body{
    font-family:'Poppins',-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    color:var(--brown);
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-weight:600;}
  a{color:var(--brown-deep);}

  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    max-width:var(--max);margin:0 auto;padding:24px 24px 16px;
  }
  .eyebrow{
    font-weight:700;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:var(--brown);
  }
  .leaf{font-size:20px;}

  .hero{background:var(--beige);padding:36px 24px 32px;}
  .hero-inner{max-width:var(--max);margin:0 auto;}
  .hero h1{font-size:clamp(26px,5vw,34px);margin:0 0 14px;line-height:1.25;text-wrap:balance;}
  .hero p{font-size:16px;margin:0 0 10px;max-width:60ch;}

  main{max-width:var(--max);margin:0 auto;padding:32px 24px 20px;}

  .section-title{
    font-weight:700;font-size:14px;letter-spacing:0.05em;text-transform:uppercase;
    color:var(--brown);margin:0 0 16px;padding-bottom:8px;border-bottom:2px solid var(--rule);
  }

  .phase-card{border:1px solid var(--rule);border-left:5px solid var(--accent,var(--brown-deep));border-radius:10px;background:#fff;margin-bottom:20px;overflow:hidden;}
  .phase-head{padding:16px 20px 12px;}
  .phase-num{font-size:12px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--accent,var(--brown-deep));}
  .phase-title{font-size:18px;font-weight:600;margin:4px 0 4px;}
  .phase-cadenza{font-size:13px;color:var(--muted);margin:0;}
  .scheda-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;border-top:1px solid var(--rule);cursor:pointer;background:var(--beige-soft);}
  .scheda-row:hover{background:var(--beige);}
  .scheda-row-title{font-weight:500;font-size:15px;}
  .scheda-row-arrow{color:var(--accent,var(--brown-deep));font-size:18px;flex:none;}

  .card{border:1px solid var(--rule);border-radius:10px;background:#fff;padding:20px;margin-bottom:20px;}
  .diario-count{font-size:15px;margin:0 0 14px;}
  .btn{
    display:inline-block;background:var(--brown-deep);color:#fbf5ea;border:none;border-radius:30px;
    font-family:inherit;font-weight:600;font-size:15px;padding:13px 30px;cursor:pointer;text-decoration:none;text-align:center;
  }
  .btn:hover{background:var(--brown);}
  .btn-ghost{background:none;color:var(--brown-deep);border:1.5px solid var(--brown-deep);padding:11px 28px;}
  .btn-ghost:hover{background:var(--beige-soft);}
  .btn-row{display:flex;gap:12px;flex-wrap:wrap;}

  .back-link{display:inline-block;margin-bottom:18px;font-size:14px;font-weight:600;color:var(--brown-deep);text-decoration:none;}
  .back-link:hover{text-decoration:underline;}

  .scheda-intro{font-size:15px;color:var(--muted);margin:0 0 22px;font-style:italic;}

  .field{background:var(--beige-soft);border-radius:10px;padding:18px 20px;margin-bottom:14px;}
  .field label{display:block;font-weight:500;font-size:15px;margin-bottom:10px;}
  .field textarea{
    width:100%;border:1px solid var(--rule);border-radius:8px;padding:11px 13px;
    font-family:inherit;font-size:15px;color:var(--brown);background:#fff;min-height:64px;resize:vertical;
  }
  .field textarea:focus{outline:2px solid var(--brown-deep);outline-offset:1px;}

  .chip-group{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{
    font-family:inherit;font-size:14px;padding:9px 16px;border-radius:20px;border:1.5px solid var(--rule);
    background:#fff;color:var(--brown);cursor:pointer;
  }
  .chip.selected{background:var(--brown-deep);border-color:var(--brown-deep);color:#fbf5ea;}
  .chip-other-input{
    display:none;margin-top:10px;width:100%;border:1px solid var(--rule);border-radius:8px;padding:10px 12px;
    font-family:inherit;font-size:14px;background:#fff;color:var(--brown);
  }

  .scale-row{display:flex;align-items:center;gap:14px;}
  .scale-row input[type="range"]{flex:1;accent-color:var(--brown-deep);}
  .scale-row .scale-val{flex:none;width:28px;text-align:center;font-weight:700;font-size:16px;}
  .scale-ends{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px;}

  .fillin p{font-size:15px;margin:0;}
  .fillin input[type="text"]{
    border:none;border-bottom:2px solid var(--brown-deep);background:transparent;font-family:inherit;
    font-size:15px;color:var(--brown);padding:2px 4px;min-width:160px;
  }
  .fillin input[type="text"]:focus{outline:none;background:var(--beige-soft);}

  .callout{background:var(--beige);border-radius:10px;padding:16px 20px;margin-bottom:20px;font-size:14.5px;}
  .callout strong{display:block;margin-bottom:4px;}

  .day{border:1px solid var(--rule);border-radius:10px;margin-bottom:14px;overflow:hidden;background:#fff;}
  .day summary{
    cursor:pointer;font-weight:700;font-size:14.5px;letter-spacing:.03em;text-transform:uppercase;
    padding:16px 20px;color:var(--brown);background:var(--beige);
    display:flex;align-items:center;justify-content:space-between;list-style:none;
  }
  .day summary::-webkit-details-marker{display:none;}
  .day summary::after{content:'+';font-size:20px;font-weight:400;}
  .day[open] summary::after{content:'\2013';}
  .day-body{padding:18px 20px 6px;}

  .entry-block{border-top:1px solid var(--rule);padding:14px 0;}
  .entry-block:first-child{border-top:none;padding-top:0;}
  .entry-meta{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
  .entry-title{font-weight:600;font-size:15px;}
  .entry-time{font-size:12px;color:var(--muted);}
  .entry-tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--rose);margin-left:8px;}
  .entry-row{font-size:14px;margin:4px 0;}
  .entry-row b{font-weight:600;}
  .entry-delete{background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;text-decoration:underline;padding:0;}

  .footer-link{display:block;text-align:center;font-size:13px;color:var(--muted);margin-top:8px;text-decoration:none;}
  .footer-link:hover{text-decoration:underline;}

  .signoff{text-align:center;font-size:15px;margin:36px 0 20px;color:var(--muted);}

  .toast{
    position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);
    background:var(--brown-deep);color:#fbf5ea;padding:12px 22px;border-radius:24px;font-size:14px;
    opacity:0;transition:opacity .25s ease, transform .25s ease;pointer-events:none;z-index:20;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .studio-badge{background:var(--rose);color:#fff;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:5px 12px;border-radius:14px;}
  .studio-top{display:flex;align-items:center;justify-content:space-between;max-width:1080px;margin:0 auto;padding:18px 24px;}
  .studio-main{max-width:1080px;margin:0 auto;padding:8px 24px 40px;}
  .studio-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:28px;align-items:start;}
  @media (max-width:820px){.studio-grid{grid-template-columns:1fr;}}
  .studio-scheda{font-size:16px;}
  .studio-scheda .field label{font-size:16px;}
  .studio-scheda h2{font-size:22px;}
  .studio-notes{background:#fff;border:1px solid var(--rule);border-radius:10px;padding:20px;position:sticky;top:20px;}
  .studio-notes h3{font-size:14px;text-transform:uppercase;letter-spacing:.05em;margin:0 0 14px;}
  .studio-notes label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px;}
  .studio-notes label:first-of-type{margin-top:0;}
  .studio-notes textarea, .studio-notes input[type="text"]{
    width:100%;border:1px solid var(--rule);border-radius:8px;padding:9px 11px;font-family:inherit;
    font-size:14px;color:var(--brown);background:var(--beige-soft);
  }
  .studio-notes textarea{min-height:52px;resize:vertical;}
  .studio-nav{display:flex;justify-content:space-between;align-items:center;margin:24px 0 18px;gap:10px;}
  .studio-select{font-family:inherit;font-size:14px;padding:8px 10px;border-radius:8px;border:1px solid var(--rule);background:#fff;color:var(--brown);}

  [hidden]{display:none !important;}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
var PHASES = [
  { id:'sentire', num:1, title:'Sentire il corpo', accent:'var(--brown-deep)', cadenza:'Ad ogni pasto, nelle prime settimane', schede:['s1','s2','s3'] },
  { id:'schemi', num:2, title:'Riconoscere schemi e regole', accent:'var(--rose)', cadenza:'Quando emerge un episodio significativo', schede:['s4','s5'] },
  { id:'bisogno', num:3, title:'Distinguere fame e bisogno', accent:'var(--sage)', cadenza:'Nei momenti di difficolta, quando serve', schede:['s6','s7','s8','s9'] },
  { id:'flessibilita', num:4, title:'Consolidare la flessibilita', accent:'var(--ochre)', cadenza:'Con cadenza settimanale', schede:['s10','s11','s12'] }
];

var SCHEDE = {
  s1: {
    title: `Prima di mangiare`,
    intro: `Prima di iniziare a mangiare, fermati per qualche istante.`,
    fields: [
      { t:'chips', id:'corpo', label:`Cosa noto nel mio corpo?`, opts:['Fame','Stanchezza','Tensione','Vuoto allo stomaco','Voglia di mangiare','Irrequietezza'], other:true },
      { t:'scale', id:'intensita', label:`Quanto e intensa la fame in questo momento?` },
      { t:'ta', id:'vogliaDi', label:`Cosa mi va di mangiare?` },
      { t:'ta', id:'pensieri', label:`Ci sono pensieri o giudizi sul fatto che io "dovrei" o "non dovrei" mangiare?` },

  s2: {

    fields: [
      { t:'chips', id:'fisico', label:`Come mi sento fisicamente?`, opts:['Ancora affamato/a','Soddisfatto/a','Pieno/a','Molto pieno/a','A disagio'], other:true },
      { t:'ta', id:'emotivo', label:`Come mi sento emotivamente?` },
      { t:'ta', id:'primoPensiero', label:`Qual e il primo pensiero che mi viene dopo aver mangiato?` },

      { t:'fillin', id:'regola2', before:`Posso mangiare`, mid:`solo se`, after:`.` },
      { t:'fillin', id:'regola3', before:`Dopo aver mangiato`, mid:`devo`, after:`.` },
      { t:'fillin', id:'regola4', before:`Se mangio`, mid:`allora significa che`, after:`.` },
      { t:'fillin', id:'regola5', before:`Un pasto perfetto per me dovrebbe essere`, after:`.` },
      { t:'ta', id:'daDoveDeriva', label:`Da dove penso possa derivare questa regola?` },
      { t:'scale', id:'rigidita', label:`Quanto e rigida?` },

      { t:'chips', id:'emozione', label:`Emozione: che cosa ho provato?`, opts:['Ansia','Colpa','Vergogna','Tristezza','Rabbia','Paura','Piacere','Sollievo'], other:true },
      { t:'scale', id:'intensitaEmozione', label:`Intensita dell'emozione` },
      { t:'ta', id:'comportamento', label:`Comportamento: che cosa ho fatto?` },
      { t:'ta', id:'conseguenzaSubito', label:`Conseguenza: come mi sono sentito/a subito dopo?` },
      { t:'ta', id:'conseguenzaDopo', label:`E qualche ora dopo?` }
    ]
  },
  s6: {
    title: `Fame o bisogno?`,
    intro: `Non sempre cio che ci porta verso il cibo e esclusivamente la fame fisica. Prima di interpretare l'esperienza, osserva semplicemente.`,
    fields: [
      { t:'ta', id:'cosaSento', label:`Cosa sento in questo momento?` },
      { t:'ta', id:'quandoIniziato', label:`Quando e iniziato?` },
      { t:'ta', id:'doveCorpo', label:`Dove lo percepisco nel corpo?` },
      { t:'ta', id:'sceglierei', label:`Se potessi scegliere liberamente, cosa desidererei?` },
      { t:'chips', id:'altroBisogno', label:`Di che cosa potrei avere bisogno, oltre al cibo?`, opts:['Riposo','Conforto','Distrazione','Contatto con qualcuno','Piacere','Sicurezza','Una pausa'], other:true },
      { t:'note', text:`Avere un'emozione o un bisogno diverso dalla fame non significa che mangiare sia sbagliato. L'obiettivo e aumentare la consapevolezza, non controllare il comportamento.` }
    ]
  },
  s7: {
    title: `Il linguaggio che uso con me stesso/a`,
    intro: `Completa le frasi, poi prova a riscriverle in modo piu descrittivo e meno giudicante.`,
    fields: [
      { t:'fillin', id:'frase1', before:`Ho mangiato troppo perche`, after:`.` },
      { t:'fillin', id:'frase2', before:`Avrei dovuto`, after:`.` },
      { t:'fillin', id:'frase3', before:`Non ho abbastanza forza di volonta perche`, after:`.` },
      { t:'ta', id:'da', label:`Da: riscrivi qui la frase cosi come ti e venuta.` },
      { t:'ta', id:'a', label:`A: riscrivila in modo piu descrittivo. Esempio: invece di "ho fallito perche ho mangiato troppo", "ho mangiato piu di quanto desiderassi e voglio capire cosa e successo".` }
    ]
  },
  s8: {
    title: `Dopo una giornata difficile`,
    intro: `Pensa a una giornata nella quale il rapporto con il cibo e stato particolarmente difficile.`,
    fields: [
      { t:'ta', id:'primaSuccesso', label:`Che cosa e successo prima?` },
      { t:'ta', id:'stavoFisicamente', label:`Come stavo fisicamente?` },
      { t:'ta', id:'stavoEmotivamente', label:`Come stavo emotivamente?` },
      { t:'ta', id:'pensieriPresenti', label:`Quali pensieri erano presenti?` },
      { t:'ta', id:'cosaAiutato', label:`Cosa mi ha aiutato, anche solo un poco?` },
      { t:'ta', id:'cosaConcedermi', label:`Cosa avrei avuto bisogno di ricevere o concedermi?` },
      { t:'ta', id:'cosaImparo', label:`Una cosa che posso imparare da questa esperienza:` }
    ]
  },
  s9: {
    title: `Osservare senza compensare`,
    intro: `Dopo aver mangiato qualcosa che considero troppo o sbagliato, quali impulsi compaiono?`,
    fields: [
      { t:'chips', id:'impulsi', label:`Seleziona quello che riconosci:`, opts:['Saltare il pasto successivo','Ridurre il cibo','Fare attivita fisica per compensare','Pesarmi','Controllare il corpo','Evitare determinati alimenti','Rimproverarmi'], other:true },
      { t:'ta', id:'temoSe', label:`Che cosa temo possa succedere se non compenso?` },
      { t:'ta', id:'penseroInvece', label:`Che cosa penso potrebbe accadere invece se interrompessi questo meccanismo?` }
    ]
  },
  s10: {
    title: `Una settimana di osservazione`,
    intro: `Una scheda per ogni giorno della settimana.`,
    note: `Questa scheda non serve per contare calorie, quantita o errori. Serve solo per osservare gli schemi che si ripetono.`,
    special: 'settimana',
    fields: [
      { t:'ta', id:'schemaRicorrente', label:`Alla fine della settimana: quale schema ricorre piu spesso?` },
      { t:'ta', id:'situazioneFacile', label:`Quale situazione mi e risultata piu facile?` },
      { t:'ta', id:'situazioneDifficile', label:`Quale piu difficile?` },
      { t:'ta', id:'cosaImparatoSuDiMe', label:`Cosa ho imparato su di me?` }
    ]
  },
  s11: {
    title: `Esperimento di flessibilita`,
    intro: `Scegli una piccola regola alimentare che senti particolarmente rigida.`,
    fields: [
      { t:'ta', id:'laMiaRegola', label:`La mia regola e:` },
      { t:'ta', id:'cosaTemo', label:`Cosa temo possa succedere se la modifico?` },
      { t:'scale', id:'forzaPaura', label:`Quanto e forte questa paura?` },
      { t:'ta', id:'cosaScelgo', label:`Il mio esperimento: che cosa scelgo di fare diversamente?` },
      { t:'ta', id:'cosaESuccesso', label:`Cosa e successo realmente?` },
      { t:'ta', id:'cosaHoProvato', label:`Cosa ho provato?` },
      { t:'ta', id:'cosaPossoImparare', label:`Cosa posso imparare da questa esperienza?` }
    ]
  },
  s12: {
    title: `Verso un rapporto piu flessibile`,
    intro: `Completa le frasi, poi guarda al prossimo piccolo passo. Non serve cambiare tutto insieme.`,

      { t:'fillin', id:'vorrei2', before:`Vorrei poter scegliere il cibo in base a`, after:`.` },
      { t:'fillin', id:'vorrei3', before:`Vorrei smettere di giudicarmi quando`, after:`.` },
      { t:'fillin', id:'vorrei4', before:`Vorrei ascoltare maggiormente`, after:`.` },
      { t:'fillin', id:'vorrei5', before:`Vorrei concedermi`, after:`.` },
      { t:'ta', id:'relazioneSerena', label:`Una relazione piu serena con il cibo, per me, significherebbe:` },
      { t:'ta', id:'prossimoPasso', label:`Una cosa piccola che posso provare questa settimana e:` },
      { t:'scale', id:'realistica', label:`Quanto mi sembra realistica?` }
    ]
  }
};

var SCHEDA_ORDER = ['s1','s2','s3','s4','s5','s6','s7','s8','s9','s10','s11','s12'];
var GIORNI = ['Lunedi','Martedi','Mercoledi','Giovedi','Venerdi','Sabato','Domenica'];

var state = { view:'home' };
var draft = {};

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function loadEntries(){
  try{ return JSON.parse(localStorage.getItem('bussolaInterna.entries')||'[]'); }
  catch(e){ return []; }
}
function saveEntries(list){
  try{ localStorage.setItem('bussolaInterna.entries', JSON.stringify(list)); }catch(e){}
}
function loadStudioNotes(){
  try{ return JSON.parse(localStorage.getItem('bussolaInterna.studioNotes')||'{}'); }
  catch(e){ return {}; }
}
function saveStudioNotes(obj){
  try{ localStorage.setItem('bussolaInterna.studioNotes', JSON.stringify(obj)); }catch(e){}
}

function showToast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer=setTimeout(function(){ t.classList.remove('show'); }, 2400);
}

function navigate(view, extra){
  state = Object.assign({ view:view }, extra||{});
  draft = {};
  window.scrollTo(0,0);
  render();
}

function renderField(f){
  if(f.t==='chips' || f.t==='chips1'){
    var multi = f.t==='chips';
    var chips = f.opts.map(function(o){
      var val = esc(o);
      return `<button type="button" class="chip" onclick="toggleChip(this,'${f.id}','${val.replace(/'/g,"\\'")}',${multi})">${val}</button>`;
    }).join('');
    var other='';
    if(f.other){
      chips += `<button type="button" class="chip" onclick="toggleOther(this,'${f.id}')">Altro</button>`;
      other = `<input type="text" class="chip-other-input" id="${f.id}_altro_input" oninput="draft['${f.id}_altro']=this.value" placeholder="Specifica...">`;
    }
    return `<div class="field"><label>${esc(f.label)}</label><div class="chip-group">${chips}</div>${other}</div>`;
  }
  if(f.t==='scale'){
    return `<div class="field"><label>${esc(f.label)}</label>
      <div class="scale-row">
        <input type="range" min="0" max="10" value="0" oninput="draft['${f.id}']=this.value; document.getElementById('${f.id}_val').textContent=this.value">
        <span class="scale-val" id="${f.id}_val">0</span>
      </div>
      <div class="scale-ends"><span>0</span><span>10</span></div>
    </div>`;
  }
  if(f.t==='ta'){
    return `<div class="field"><label>${esc(f.label)}</label><textarea oninput="draft['${f.id}']=this.value" placeholder="Scrivi qui..."></textarea></div>`;
  }
  if(f.t==='fillin'){
    var mid = f.mid ? ` <input type="text" oninput="draft['${f.id}_mid']=this.value" placeholder="..."> ${esc(f.mid)}` : '';
    return `<div class="field fillin"><p>${esc(f.before)}${mid} <input type="text" oninput="draft['${f.id}']=this.value" placeholder="...">${esc(f.after)}</p></div>`;
  }
  if(f.t==='note'){
    return `<div class="callout"><strong>Un promemoria</strong>${esc(f.text)}</div>`;
  }
  return '';
}

function toggleChip(el, fieldId, value, multi){
  if(multi){
    if(!draft[fieldId]) draft[fieldId]=[];
    var idx=draft[fieldId].indexOf(value);
    if(idx>-1){ draft[fieldId].splice(idx,1); el.classList.remove('selected'); }
    else { draft[fieldId].push(value); el.classList.add('selected'); }
  } else {
    draft[fieldId]=value;
    var group=el.closest('.chip-group');
    Array.prototype.forEach.call(group.querySelectorAll('.chip'), function(c){ c.classList.remove('selected'); });
    el.classList.add('selected');
  }
}
function toggleOther(el, fieldId){
  var input=document.getElementById(fieldId+'_altro_input');
  var showing = input.style.display==='block';
  input.style.display = showing?'none':'block';
  el.classList.toggle('selected', !showing);
  if(showing){ delete draft[fieldId+'_altro']; input.value=''; }
}

function renderHome(){
  var entries = loadEntries();
  var weekAgo = Date.now() - 7*24*60*60*1000;
  var recentDays = {};
  entries.forEach(function(e){ if(e.ts>weekAgo) recentDays[new Date(e.ts).toDateString()]=1; });
  var dayCount = Object.keys(recentDays).length;
  var countText = dayCount>0
    ? `Negli ultimi 7 giorni hai raccolto osservazioni in ${dayCount} giorni diversi.`
    : `Non c'e ancora nessuna osservazione salvata. Puoi iniziare quando vuoi, con la scheda che ti sembra piu adatta a questo momento.`;

  var phasesHtml = PHASES.map(function(p){
    var rows = p.schede.map(function(sid){
      var s = SCHEDE[sid];
      return `<div class="scheda-row" onclick="navigate('scheda',{schedaId:'${sid}'})">
        <span class="scheda-row-title">${esc(s.title)}</span>
        <span class="scheda-row-arrow">&rsaquo;</span>
      </div>`;
    }).join('');
    return `<div class="phase-card" style="--accent:${p.accent}">
      <div class="phase-head">
        <div class="phase-num">Fase ${p.num}</div>
        <div class="phase-title">${esc(p.title)}</div>
        <p class="phase-cadenza">${esc(p.cadenza)}</p>
      </div>
      ${rows}
    </div>`;
  }).join('');

  document.getElementById('app').innerHTML = `
    <div class="topbar">
      <span class="eyebrow">Uno spazio per ascoltarti</span>
      <span class="leaf">&#127807;</span>
    </div>
    <div class="hero">
      <div class="hero-inner">
        <h1>Bussola Interna</h1>
        <p>Qui puoi fermarti un momento prima, durante e dopo i pasti e osservare cosa succede nel tuo corpo. Puoi farlo con calma, senza cercare la perfezione: basta iniziare a notare, con curiosita invece che con giudizio.</p>
      </div>
    </div>
    <main>
      <div class="section-title">Il percorso</div>
      ${phasesHtml}
      <div class="section-title">Il tuo diario</div>
      <div class="card">
        <p class="diario-count">${countText}</p>
        <div class="btn-row">
          <button class="btn" onclick="navigate('diario')">Vedi il tuo diario</button>
        </div>
      </div>
      <a class="footer-link" href="#" onclick="navigate('studio');return false;">Modalita Studio</a>
      <p class="signoff">Ci vediamo in call, Mariastella &#127807;</p>
    </main>
  `;
}

function renderScheda(schedaId, opts){
  opts = opts||{};
  var s = SCHEDE[schedaId];
  var fieldsHtml = s.fields.map(renderField).join('');
  var noteHtml = s.note ? `<div class="callout"><strong>Un promemoria</strong>${esc(s.note)}</div>` : '';
  var specialHtml = '';
  if(s.special==='settimana'){
    specialHtml = GIORNI.map(function(g,i){
      return `<details class="day"><summary>${g}</summary><div class="day-body">
        <div class="field"><label>Cosa ho notato prima di mangiare</label><textarea oninput="draft['giorno${i}_prima']=this.value" placeholder="Scrivi qui..."></textarea></div>
        <div class="field"><label>Durante</label><textarea oninput="draft['giorno${i}_durante']=this.value" placeholder="Scrivi qui..."></textarea></div>
        <div class="field"><label>Dopo</label><textarea oninput="draft['giorno${i}_dopo']=this.value" placeholder="Scrivi qui..."></textarea></div>
      </div></details>`;
    }).join('');
  }
  var backTarget = opts.studio ? 'studio' : 'home';
  var backLabel = opts.studio ? 'Torna alla modalita studio' : 'Torna alla bussola';
  var saveFn = opts.studio ? `saveStudioEntry('${schedaId}')` : `savePatientEntry('${schedaId}')`;

  var body = `
    <a class="back-link" href="#" onclick="navigate('${backTarget}');return false;">&lsaquo; ${backLabel}</a>
    <h2>${esc(s.title)}</h2>
    <p class="scheda-intro">${esc(s.intro)}</p>
    ${noteHtml}
    ${specialHtml}
    ${fieldsHtml}
    <div class="btn-row"><button class="btn" onclick="${saveFn}">Salva osservazione</button></div>
  `;

  if(opts.studio){
    return body;
  }
  document.getElementById('app').innerHTML = `<main>${body}</main>`;
}

function savePatientEntry(schedaId){
  var entries = loadEntries();
  entries.push({ id: Date.now()+'-'+Math.random().toString(36).slice(2), schedaId:schedaId, ts:Date.now(), source:'auto', answers: Object.assign({}, draft) });
  saveEntries(entries);
  showToast('Osservazione salvata.');
  navigate('home');
}

function formatAnswers(schedaId, answers){
  var s = SCHEDE[schedaId];
  var rows = [];
  if(s.special==='settimana'){
    GIORNI.forEach(function(g,i){
      ['prima','durante','dopo'].forEach(function(mom){
        var v = answers['giorno'+i+'_'+mom];
        if(v) rows.push(`<div class="entry-row"><b>${g}, ${mom}:</b> ${esc(v)}</div>`);
      });
    });
  }
  s.fields.forEach(function(f){
    if(f.t==='note') return;
    if(f.t==='chips'){
      var vals=(answers[f.id]||[]).slice();
      if(answers[f.id+'_altro']) vals.push(answers[f.id+'_altro']);
      if(vals.length) rows.push(`<div class="entry-row"><b>${esc(f.label)}</b> ${esc(vals.join(', '))}</div>`);
    } else if(f.t==='chips1'){
      if(answers[f.id]) rows.push(`<div class="entry-row"><b>${esc(f.label)}</b> ${esc(answers[f.id])}</div>`);
    } else if(f.t==='scale'){
      if(answers[f.id]!=null) rows.push(`<div class="entry-row"><b>${esc(f.label)}</b> ${esc(answers[f.id])}/10</div>`);
    } else if(f.t==='ta'){
      if(answers[f.id]) rows.push(`<div class="entry-row"><b>${esc(f.label)}</b> ${esc(answers[f.id])}</div>`);
    } else if(f.t==='fillin'){
      var txt = f.before + ' ' + (answers[f.id]||'...') + (f.mid ? ' '+f.mid+' '+(answers[f.id+'_mid']||'...') : '') + ' ' + f.after;
      if(answers[f.id] || answers[f.id+'_mid']) rows.push(`<div class="entry-row">${esc(txt)}</div>`);
    }
  });
  return rows.join('') || `<div class="entry-row">Nessuna risposta scritta.</div>`;
}

function renderDiario(){
  var entries = loadEntries().sort(function(a,b){ return b.ts-a.ts; });
  var byDay = {};
  var order = [];
  entries.forEach(function(e){
    var key = new Date(e.ts).toDateString();
    if(!byDay[key]){ byDay[key]=[]; order.push(key); }
    byDay[key].push(e);
  });
  var html;
  if(!order.length){
    html = `<div class="card"><p>Non hai ancora salvato nessuna osservazione. Quando compili una scheda, la trovi qui.</p></div>`;
  } else {
    html = order.map(function(key, idx){
      var dateLabel = new Date(byDay[key][0].ts).toLocaleDateString('it-IT', { weekday:'long', day:'numeric', month:'long' });
      var blocks = byDay[key].map(function(e){
        var s = SCHEDE[e.schedaId];
        var time = new Date(e.ts).toLocaleTimeString('it-IT', { hour:'2-digit', minute:'2-digit' });
        var tag = e.source==='studio' ? `<span class="entry-tag">In visita</span>` : '';
        return `<div class="entry-block">
          <div class="entry-meta">
            <span class="entry-title">${esc(s.title)}${tag}</span>
            <span class="entry-time">${time}</span>
          </div>
          ${formatAnswers(e.schedaId, e.answers)}
          <div style="margin-top:8px"><button class="entry-delete" onclick="deleteEntry('${e.id}')">Elimina questa osservazione</button></div>
        </div>`;
      }).join('');
      return `<details class="day" ${idx===0?'open':''}><summary>${dateLabel}</summary><div class="day-body">${blocks}</div></details>`;
    }).join('');
  }
  document.getElementById('app').innerHTML = `
    <main>
      <a class="back-link" href="#" onclick="navigate('home');return false;">&lsaquo; Torna alla bussola</a>
      <h2>Il tuo diario</h2>
      ${html}
    </main>
  `;
}

function deleteEntry(id){
  if(!confirm('Eliminare questa osservazione?')) return;
  var entries = loadEntries().filter(function(e){ return e.id!==id; });
  saveEntries(entries);
  renderDiario();
}

function saveStudioEntry(schedaId){
  var entries = loadEntries();
  entries.push({ id: Date.now()+'-'+Math.random().toString(36).slice(2), schedaId:schedaId, ts:Date.now(), source:'studio', answers: Object.assign({}, draft) });
  saveEntries(entries);
  showToast('Osservazione salvata.');
  var idx = SCHEDA_ORDER.indexOf(schedaId);
  if(idx < SCHEDA_ORDER.length-1){
    navigate('studio', { studioIdx: idx+1 });
  } else {
    navigate('studio', { studioIdx: idx });
  }
}

function renderStudio(){
  var idx = state.studioIdx || 0;
  var schedaId = SCHEDA_ORDER[idx];
  draft = {};
  var notes = loadStudioNotes();
  var schedaHtml = renderScheda(schedaId, { studio:true });

  var options = SCHEDA_ORDER.map(function(sid,i){
    return `<option value="${i}" ${i===idx?'selected':''}>${esc(SCHEDE[sid].title)}</option>`;
  }).join('');

  document.getElementById('app').innerHTML = `
    <div class="studio-top">
      <span class="studio-badge">Modalita Studio</span>
      <a class="footer-link" href="#" onclick="navigate('home');return false;">Esci</a>
    </div>
    <div class="studio-main">
      <div class="studio-nav">
        <button class="btn-ghost btn" ${idx===0?'disabled':''} onclick="navigate('studio',{studioIdx:${idx-1}})">&lsaquo; Indietro</button>
        <select class="studio-select" onchange="navigate('studio',{studioIdx:parseInt(this.value,10)})">${options}</select>
        <button class="btn-ghost btn" ${idx===SCHEDA_ORDER.length-1?'disabled':''} onclick="navigate('studio',{studioIdx:${idx+1}})">Avanti &rsaquo;</button>
      </div>
      <div class="studio-grid">
        <div class="studio-scheda">${schedaHtml}</div>
        <div class="studio-notes">
          <h3>Note della visita</h3>
          <label>Osservazioni, temi emersi</label>
          <textarea oninput="updateStudioNote('osservazioni', this.value)">${esc(notes.osservazioni)}</textarea>
          <label>Obiettivo concordato</label>
          <textarea oninput="updateStudioNote('obiettivo', this.value)">${esc(notes.obiettivo)}</textarea>
          <label>Prossimo esercizio</label>
          <textarea oninput="updateStudioNote('prossimoEsercizio', this.value)">${esc(notes.prossimoEsercizio)}</textarea>
          <label>Data del prossimo incontro</label>
          <input type="text" oninput="updateStudioNote('dataProssimo', this.value)" value="${esc(notes.dataProssimo)}" placeholder="gg/mm/aaaa">
          <div class="btn-row" style="margin-top:16px">
            <button class="btn" onclick="copyStudioNotes()">Copia le note</button>
            <button class="btn-ghost btn" onclick="nuovaVisita()">Nuova visita</button>
          </div>
        </div>
      </div>
    </div>
  `;
}

function updateStudioNote(key, value){
  var notes = loadStudioNotes();
  notes[key] = value;
  saveStudioNotes(notes);
}

function copyStudioNotes(){
  var n = loadStudioNotes();
  var text = `Osservazioni, temi emersi:\n${n.osservazioni||''}\n\nObiettivo concordato:\n${n.obiettivo||''}\n\nProssimo esercizio:\n${n.prossimoEsercizio||''}\n\nData del prossimo incontro: ${n.dataProssimo||''}`;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ showToast('Note copiate.'); }).catch(function(){ showToast('Non sono riuscita a copiare le note.'); });
  } else {
    showToast('Copia non disponibile su questo browser.');
  }
}

function nuovaVisita(){
  if(!confirm('Cancellare le note di questa visita per iniziarne una nuova?')) return;
  saveStudioNotes({});
  navigate('studio', { studioIdx:0 });
}

function render(){
  if(state.view==='home') renderHome();
  else if(state.view==='scheda') renderScheda(state.schedaId, {});
  else if(state.view==='diario') renderDiario();
  else if(state.view==='studio') renderStudio();
}

render();
</script>
</body>
</html>
