<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Occhiometro">
<title>Occhiometro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#faf6ee;
  --beige:#ead9c5;
  --beige-soft:#f1e6d6;
  --brown:#4a3527;
  --brown-deep:#55402e;
  --rule:#d9c6ac;
  --muted:#7a6754;
  --giallo:#F3DF4A;
  --blu:#2FA3D9;
  --arancio:#F6B12D;
  --verde:#8FC85A;
  --rosso:#E9A0AE;
  --max:720px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--cream);}
body{font-family:'Poppins',-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:var(--brown);line-height:1.55;-webkit-font-smoothing:antialiased;}
h1,h2,h3{font-weight:600;}
.topbar{display:flex;align-items:center;justify-content:space-between;max-width:var(--max);margin:0 auto;padding:22px 20px 14px;}
.eyebrow{font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase;}
.dots{display:flex;gap:5px;}
.dots span{width:11px;height:11px;border-radius:50%;}
.hero{background:var(--beige);padding:28px 20px 24px;}
.hero-inner{max-width:var(--max);margin:0 auto;}
.hero h1{font-size:clamp(28px,7vw,36px);font-weight:800;margin:0 0 8px;line-height:1.15;text-transform:uppercase;letter-spacing:-.01em;}
.hero p{font-size:15px;margin:0;max-width:60ch;}
.tabs{position:sticky;top:0;z-index:5;background:var(--cream);border-bottom:1px solid var(--rule);}
.tabs-inner{max-width:var(--max);margin:0 auto;display:flex;gap:6px;padding:10px 16px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
.tab{flex:none;font-family:inherit;font-size:14px;font-weight:600;padding:9px 15px;border-radius:20px;border:1.5px solid var(--rule);background:#fff;color:var(--brown);cursor:pointer;}
.tab.on{background:var(--brown-deep);border-color:var(--brown-deep);color:#fbf5ea;}
main{max-width:var(--max);margin:0 auto;padding:22px 16px 40px;}
.section-title{font-weight:700;font-size:13px;letter-spacing:.05em;text-transform:uppercase;margin:22px 0 12px;padding-bottom:8px;border-bottom:2px solid var(--rule);}
.section-title:first-child{margin-top:0;}
.intro{font-size:14.5px;color:var(--muted);margin:0 0 18px;}
.field{background:var(--beige-soft);border-radius:10px;padding:16px 16px;margin-bottom:12px;}
.field label,.field .lbl{display:block;font-weight:500;font-size:15px;margin-bottom:8px;}
.field .hint{display:block;font-weight:400;font-size:12.5px;color:var(--muted);margin:-4px 0 8px;}
.field input[type="text"],.field input[type="date"],.field textarea,.field input[type="number"]{width:100%;border:1px solid var(--rule);border-radius:8px;padding:11px 12px;font-family:inherit;font-size:16px;color:var(--brown);background:#fff;}
.field textarea{min-height:60px;resize:vertical;}
.field input:focus,.field textarea:focus{outline:2px solid var(--brown-deep);outline-offset:1px;}
.row2{display:flex;gap:10px;}
.row2 > div{flex:1;min-width:0;}
.chip-group{display:flex;flex-wrap:wrap;gap:7px;}
.chip{font-family:inherit;font-size:14px;padding:8px 14px;border-radius:20px;border:1.5px solid var(--rule);background:#fff;color:var(--brown);cursor:pointer;}
.chip.on{background:var(--brown-deep);border-color:var(--brown-deep);color:#fbf5ea;}
.chip.col{font-weight:700;font-size:13px;letter-spacing:.03em;}
.chip.col.on{outline:3px solid var(--brown-deep);outline-offset:1px;}
.chip.gram{font-weight:700;min-width:64px;text-align:center;}
.c-GIALLO{background:var(--giallo);border-color:var(--giallo);color:#4a3527;}
.c-BLU{background:var(--blu);border-color:var(--blu);color:#fff;}
.c-ARANCIONE{background:var(--arancio);border-color:var(--arancio);color:#4a3527;}
.c-VERDE{background:var(--verde);border-color:var(--verde);color:#2f3b1f;}
.c-ROSSO{background:var(--rosso);border-color:var(--rosso);color:#4a3527;}
.colrow{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px;}
.food-btn{font-family:inherit;font-size:14px;font-weight:500;padding:9px 14px;border-radius:10px;border:1.5px solid var(--rule);background:#fff;color:var(--brown);cursor:pointer;text-align:left;}
.food-btn .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;vertical-align:middle;}
.food-btn.on{border-color:var(--brown-deep);background:var(--brown-deep);color:#fbf5ea;}
.result{background:#fff;border:1.5px solid var(--rule);border-radius:12px;padding:16px;margin:14px 0;}
.result-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
.result-head b{font-size:17px;}
.result-head .g{font-weight:800;font-size:22px;}
.result-body{display:flex;gap:16px;align-items:flex-start;}
.result-body ul{margin:0;padding-left:18px;flex:1;}
.result-body li{font-size:14.5px;margin-bottom:6px;}
.plate{flex:none;width:130px;text-align:center;font-size:12px;color:var(--muted);}
.plate svg{width:130px;height:130px;display:block;margin:0 auto 4px;}
.src-note{font-size:11.5px;color:var(--muted);margin-top:10px;}
@media (max-width:520px){ .result-body{flex-direction:column-reverse;align-items:stretch;} .plate{width:100%;} }
.scale-row{display:flex;align-items:center;gap:12px;}
.scale-row input[type="range"]{flex:1;accent-color:var(--brown-deep);}
.scale-val{flex:none;width:30px;text-align:center;font-weight:700;font-size:17px;}
.scale-desc{font-size:12.5px;color:var(--muted);margin-top:6px;min-height:18px;}
.btn{display:inline-block;background:var(--brown-deep);color:#fbf5ea;border:none;border-radius:30px;font-family:inherit;font-weight:600;font-size:15px;padding:13px 28px;cursor:pointer;text-decoration:none;text-align:center;}
.btn:disabled{opacity:.5;}
.btn-ghost{background:none;color:var(--brown-deep);border:1.5px solid var(--brown-deep);padding:11px 24px;}
.btn-sm{font-size:13.5px;padding:9px 18px;}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;}
.callout{background:var(--beige);border-radius:10px;padding:14px 16px;margin-bottom:16px;font-size:14px;}
.callout b{font-weight:700;}
.day{border:1px solid var(--rule);border-radius:10px;margin-bottom:12px;overflow:hidden;background:#fff;}
.day summary{cursor:pointer;font-weight:700;font-size:14px;letter-spacing:.03em;text-transform:uppercase;padding:14px 16px;background:var(--beige);display:flex;justify-content:space-between;list-style:none;}
.day summary::-webkit-details-marker{display:none;}
.day summary::after{content:'+';font-size:20px;font-weight:400;}
.day[open] summary::after{content:'\2013';}
.day-body{padding:6px 16px;}
.entry{border-top:1px solid var(--rule);padding:12px 0;}
.entry:first-child{border-top:none;}
.entry-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;}
.entry-head b{font-size:15px;}
.tag{font-size:11px;font-weight:700;padding:2px 9px;border-radius:10px;letter-spacing:.03em;}
.tag.week{background:var(--beige-soft);color:var(--muted);}
.entry-row{font-size:14px;margin:3px 0;}
.gap{display:inline-block;font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:10px;background:#eef3e6;color:#3d5a24;}
.gap.far{background:#f6e7dc;color:#7a4a28;}
.del{background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;text-decoration:underline;padding:0;margin-top:4px;font-family:inherit;}
.empty{font-size:14.5px;color:var(--muted);}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--brown-deep);color:#fbf5ea;padding:11px 18px;border-radius:24px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;text-align:center;z-index:20;}
.toast.show{opacity:1;}
.savebar{font-size:12px;color:var(--muted);text-align:center;margin-top:10px;}
.footer{text-align:center;font-size:13px;color:var(--muted);padding:10px 16px 30px;}
.fonti p{font-size:12.5px;color:var(--muted);margin:0 0 8px;}
</style>
</head>
<body>

<div class="topbar"><span class="eyebrow">Percorso nutrizionale personalizzato</span><span class="dots"><span style="background:var(--giallo)"></span><span style="background:var(--blu)"></span><span style="background:var(--arancio)"></span><span style="background:var(--verde)"></span></span></div>
<div class="hero"><div class="hero-inner">
  <h1>Occhiometro</h1>
  <p>Tocca la porzione scritta nel tuo schema e guarda quanto fa a occhio. Quello che salvi resta su questo telefono.</p>
</div></div>

<div class="tabs"><div class="tabs-inner" id="tabs"></div></div>
<div id="app"></div>
<div class="footer">Ci vediamo in call, Mariastella &#127807;</div>
<div class="toast" id="toast"></div>

<script>
var SLUG = 'universale';
var K_ENTRIES = 'occhiometro.' + SLUG + '.entries';
var K_DRAFT = 'occhiometro.' + SLUG + '.draft';
var K_NOME = 'occhiometro.' + SLUG + '.nome';
var K_MIE = 'occhiometro.' + SLUG + '.porzioni';
var K_MEST = 'occhiometro.' + SLUG + '.mestoli';

var COLORI = ['GIALLO','BLU','ARANCIONE','VERDE','ROSSO'];
var COLVAR = {GIALLO:'giallo',BLU:'blu',ARANCIONE:'arancio',VERDE:'verde',ROSSO:'rosso'};
var COLHEX = {GIALLO:'#F3DF4A',BLU:'#2FA3D9',ARANCIONE:'#F6B12D',VERDE:'#8FC85A',ROSSO:'#E9A0AE'};
var SETTIMANE = ['Settimana 1','Settimana 2','Settimana 3','Ripasso'];
var PASTI = ['Colazione','Spuntino','Pranzo','Merenda','Cena','Dopo cena','Fuori casa'];
var SCALA = {
  0:`Fame dolorosa, molto intensa, senso di urgenza`,
  1:`Fame irritante, hai ansia di mangiare`,
  2:`Molta fame, vorresti un pasto o uno snack`,
  3:`Fame e voglia di mangiare, ma senza urgenza`,
  4:`Un po' di fame, si potrebbe quasi fare a meno di mangiare`,
  5:`Neutro, né fame né sazietà`,
  6:`Inizi a sentire il senso di sazietà`,
  7:`Pienezza piacevole, senso di appagamento`,
  8:`Un po' troppa pienezza, non piacevole ma nemmeno fastidiosa`,
  9:`Pienezza forte, come se dovessi allentare la cintura`,
  10:`Quasi doloroso, senso di nausea`
};
var CAMPI_VUOTI = { settimana:'', data:'', pasto:'', alimento:'', colore:'', aspetto:'', stima:'', bilancia:'', fame:'', sazieta:'', note:'' };

var state = { view:'trova', food:null, g:null };

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function load(k,def){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):def; }catch(e){ return def; } }
function store(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch(e){ return false; } }
function oggi(){ var d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
function toast(msg){ var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(function(){t.classList.remove('show');},2600); }
function numero(s){ var m=String(s||'').replace(',','.').match(/-?\d+(\.\d+)?/); return m?parseFloat(m[0]):null; }

/* ---------- MISURE ---------- */
/* arrotonda a mezze unità: 1 manciata e mezza, 2 cucchiai e mezzo */
function mis(x, sing, plur, fem){
  var r = Math.round(x*2)/2; if(r<0.5) r=0.5;
  var i = Math.floor(r), half = (r-i)===0.5;
  if(i===0) return (fem?'mezza ':'mezzo ')+sing;
  return i+' '+(i===1?sing:plur)+(half?(' e mezz'+(fem?'a':'o')):'');
}
function circa(n){ return 'circa '+Math.round(n); }
function frazMano(r){
  if(r<0.42) return 'circa un terzo della mano aperta';
  if(r<0.58) return 'circa metà della mano aperta';
  if(r<0.75) return 'circa due terzi della mano aperta';
  if(r<0.92) return 'circa tre quarti della mano aperta';
  return 'circa tutta la mano aperta';
}
function testoFondo(f){
  if(f<0.6) return 'Copre circa metà del fondo';
  if(f<0.8) return 'Copre circa due terzi del fondo';
  if(f<0.95) return 'Copre tutto il fondo';
  if(f<1.1) return 'Fondo pieno, arriva alla tesa';
  if(f<1.35) return 'Sale un po’ sulla tesa';
  return 'Occupa anche la tesa';
}
function testoPiano(f){
  if(f<0.2) return 'Meno di un quarto del piatto';
  if(f<0.3) return 'Circa un quarto del piatto';
  if(f<0.4) return 'Circa un terzo del piatto';
  if(f<0.56) return 'Circa metà del piatto';
  if(f<0.7) return 'Circa due terzi del piatto';
  return 'Quasi tutto il piatto';
}
function mestolo(chiave, gcotti, nome){
  var m = load(K_MEST,{})[chiave];
  if(m && numero(m)>0) return mis(gcotti/numero(m),'mestolo raso','mestoli rasi',false)+' (il tuo mestolo)';
  return null;
}

/* fonti abbreviate: L14 = LARN 2014, L24 = LARN 2024, BNF = British Nutrition Foundation 2019, Q = foto del quiz */
var FOODS = [
  { id:'pasta', nome:'Pasta secca', col:'GIALLO', fasce:[40,50,60,70,80,90,100,120], calc:function(g){
      var cotti = g*2, r = [];
      r.push(`Da cruda: circa ${Math.round(g/1.6/5)*5} penne o fusilli, ${mis(g/37.5,'manciata','manciate',true)}`);
      r.push(`Spaghetti: un mazzetto largo come una moneta da 1 euro fa circa 80 g`);
      r.push(`Da cotta (circa ${Math.round(cotti)} g): ${mis(cotti/20,'cucchiaio colmo','cucchiai colmi',false)}, ${mis(cotti/90,'mano a coppa','mani a coppa',true)}`);
      var me = mestolo('pasta',cotti); if(me) r.push(`Col mestolo: ${me}`);
      return { righe:r, piatto:{tipo:'fondo', f:g/75, testo:testoFondo(g/75)}, fonte:'LARN 2014 (80 g circa 50 penne), BNF 2019 (2 manciate 65-75 g, 2 mani a coppa 180 g cotti), quiz (1 cucchiaio di pasta cotta circa 20 g; 80 g riempiono il fondo del piatto fondo)' };
  }},
  { id:'riso', nome:'Riso, farro, orzo, cous cous, quinoa', col:'GIALLO', fasce:[40,50,60,70,80,90,100,120], calc:function(g){
      var cotti = g*2.5, r = [];
      r.push(`Da crudi: ${mis(g/20,'cucchiaio colmo','cucchiai colmi',false)}, ${mis(g/37.5,'manciata','manciate',true)}`);
      r.push(`Da cotti (circa ${Math.round(cotti)} g): ${mis(g/11,'cucchiaio colmo','cucchiai colmi',false)}, ${mis(cotti/90,'mano a coppa','mani a coppa',true)}`);
      var me = mestolo('riso',cotti); if(me) r.push(`Col mestolo: ${me}`);
      r.push(`Basmati e quinoa crescono di più in cottura, farro e riso venere un po’ meno`);
      return { righe:r, piatto:{tipo:'fondo', f:g/55, testo:testoFondo(g/55)}, fonte:'LARN 2014 (80 g circa 4 cucchiai), BNF 2019, quiz (50 g crudi = 4-5 cucchiai colmi da cotti e coprono il fondo del piatto fondo)' };
  }},
  { id:'pastafresca', nome:'Pasta fresca, gnocchi', col:'GIALLO', fasce:[60,70,80,90,100,120,150,200], calc:function(g){
      var cotti = g*2, r = [];
      r.push(`Pasta fresca all’uovo da cotta: circa ${Math.round(cotti)} g, ${mis(cotti/20,'cucchiaio colmo','cucchiai colmi',false)}`);
      r.push(`Una confezione da 250 g contiene circa ${mis(250/g,"porzione","porzioni",true)} da ${g} g`);
      r.push(`Gnocchi di patate: una confezione da 500 g contiene circa ${mis(500/g,"porzione","porzioni",true)} da ${g} g`);
      return { righe:r, piatto:{tipo:'fondo', f:cotti/150, testo:testoFondo(cotti/150)}, fonte:'LARN 2014 (pasta fresca 100 g), quiz (60 g crudi diventano circa 120 g cotti)' };
  }},
  { id:'pane', nome:'Pane', col:'GIALLO', fasce:[30,50,60,80,100], calc:function(g){
      return { righe:[
        `${mis(g/50,'fetta media','fette medie',true)} di pagnotta`,
        `Oppure ${mis(g/50,'panino piccolo','panini piccoli',false)}`,
        `80 g sono una focaccina che riempie bene il palmo`
      ], piatto:null, fonte:'LARN 2014 (50 g una fetta media o un panino piccolo), quiz (focaccina 80 g)' };
  }},
  { id:'patate', nome:'Patate', col:'GIALLO', fasce:[150,200,250,300], calc:function(g){
      return { righe:[
        `${mis(g/100,'patata piccola','patate piccole',true)}`,
        `Una patata grande come il tuo pugno pesa circa 220 g`,
        `Mais e patate stanno sempre nel giallo`
      ], piatto:{tipo:'piano', f:0.25*g/200, testo:testoPiano(0.25*g/200)}, fonte:'LARN 2014 (200 g due patate piccole), BNF 2019 (patata al forno grande come il pugno)' };
  }},
  { id:'carne', nome:'Carne bianca o rossa', col:'BLU', fasce:[80,100,120,150,200], calc:function(g){
      return { righe:[
        `${mis(g/100,'fetta','fette',true)} di petto di pollo o tacchino, oppure ${mis(g/100,'fettina','fettine',true)} o ${mis(g/100,'hamburger','hamburger',false)}`,
        `Da cotta: ${frazMano(g/320)}`
      ], piatto:{tipo:'piano', f:0.25*g/100, testo:testoPiano(0.25*g/100)}, fonte:'LARN 2014 (100 g una fetta di petto o una fettina), BNF 2019 (petto di pollo 160 g crudo circa metà della mano)' };
  }},
  { id:'pesce', nome:'Pesce fresco o surgelato', col:'BLU', fasce:[100,150,200,250], calc:function(g){
      return { righe:[
        `${mis(g/150,'filetto medio','filetti medi',false)}, oppure ${mis(g/150,'pesce piccolo','pesci piccoli',false)}`,
        `Frutti di mare: ${circa(25*g/150)} cozze, ${circa(3*g/150)} gamberoni, ${circa(20*g/150)} gamberetti`,
        `${frazMano(g/195)}`
      ], piatto:{tipo:'piano', f:0.25*g/150, testo:testoPiano(0.25*g/150)}, fonte:'LARN 2014 (150 g un filetto medio, 25 cozze, 3 gamberoni, 20 gamberetti), BNF 2019 (filetto crudo 140-195 g da metà a tutta la mano)' };
  }},
  { id:'legumi', nome:'Legumi cotti, in scatola o surgelati', col:'BLU', fasce:[100,150,200,250], calc:function(g){
      var r = [`${mis(g/20,'cucchiaio','cucchiai',false)}`, `Una scatola piccola sgocciolata pesa circa 150 g: guarda il peso sgocciolato in etichetta`];
      var me = mestolo('legumi',g); if(me) r.push(`Col mestolo: ${me}`);
      return { righe:r, piatto:{tipo:'piano', f:g/300, testo:testoPiano(g/300)}, fonte:'LARN 2014 (150 g mezzo piatto, una scatola piccola, 7-8 cucchiai)' };
  }},
  { id:'legumisecchi', nome:'Legumi secchi', col:'BLU', fasce:[30,40,50,60], calc:function(g){
      return { righe:[`Da secchi: ${mis(g/14,'cucchiaio','cucchiai',false)}`, `In cottura il peso circa triplica: da cotti circa ${Math.round(g*3)} g`], piatto:{tipo:'piano', f:g*3/300, testo:testoPiano(g*3/300)}, fonte:'LARN 2014 (50 g 3-4 cucchiai), SINU 2024 (conversione crudo-cotto)' };
  }},
  { id:'uova', nome:'Uova', col:'BLU', fasce:[50,100,150], calc:function(g){
      return { righe:[`${mis(g/50,'uovo','uova',false)}: qui conti e basta`], piatto:null, fonte:'LARN 2014 (un uovo 50 g)' };
  }},
  { id:'freschi', nome:'Formaggi freschi', col:'BLU', fasce:[50,100,125], calc:function(g){
      return { righe:[`${mis(g/100,'mozzarella piccola','mozzarelle piccole',true)}`, `Oppure ${circa(g/25)} ciliegine di mozzarella`], piatto:null, fonte:'LARN 2014 (100 g una mozzarella piccola o 4 ciliegine)' };
  }},
  { id:'stagionati', nome:'Formaggi stagionati', col:'BLU', fasce:[20,30,50], calc:function(g){
      return { righe:[`Grande come ${mis(g/15,'pollice','pollici',false)} affiancati`, `${mis(g/20,'cubetto','cubetti',false)} di parmigiano`, `Un cucchiaio di grattugiato sono circa 10 g`], piatto:null, fonte:'BNF 2019 (30 g grande come due pollici), LARN 2014 (50 g 2 cubetti e mezzo; grattugiato 10 g un cucchiaio)' };
  }},
  { id:'yogurt', nome:'Yogurt', col:'BLU', fasce:[125,150,170,200], calc:function(g){
      return { righe:[`Guarda il peso sul vasetto: ${g} g sono ${mis(g/125,'vasetto standard da 125 g','vasetti standard da 125 g',false)}`], piatto:null, fonte:'LARN 2014 (125 g un vasetto)' };
  }},
  { id:'olio', nome:'Olio extravergine', col:'ARANCIONE', fasce:[5,10,15,20,30], calc:function(g){

  }},

  }},

function foodById(id){ for(var i=0;i<FOODS.length;i++){ if(FOODS[i].id===id) return FOODS[i]; } return null; }

/* ---------- PIATTO SVG ---------- */
function plateSvg(p, col){
  var c = COLHEX[col] || '#F3DF4A';
  if(p.tipo==='fondo'){
    var f = Math.max(0.15, p.f), inner = 58, outer = 92, fill;
    if(f<=1){ fill = `<circle cx="100" cy="100" r="${(inner*Math.sqrt(f)).toFixed(1)}" fill="${c}"/>`; }
    else { var rr = inner + (outer-inner-4)*Math.min(1,(f-1)/0.6); fill = `<circle cx="100" cy="100" r="${rr.toFixed(1)}" fill="${c}" opacity=".9"/>`; }
    return `<svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="${outer}" fill="#fff" stroke="#d9c6ac" stroke-width="3"/><circle cx="100" cy="100" r="${inner}" fill="#f4ede1" stroke="#e6d8c2" stroke-width="2"/>${fill}</svg>`;
  }
  var a = Math.min(0.999, Math.max(0.05, p.f)) * 2*Math.PI, R = 80;
  var x = 100 + R*Math.sin(a), y = 100 - R*Math.cos(a), large = a>Math.PI?1:0;
  return `<svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="94" fill="#fff" stroke="#d9c6ac" stroke-width="3"/><circle cx="100" cy="100" r="${R}" fill="#f4ede1"/><path d="M100 100 L100 ${100-R} A${R} ${R} 0 ${large} 1 ${x.toFixed(1)} ${y.toFixed(1)} Z" fill="${c}"/></svg>`;
}
function resultCard(food, g, extra){
  var res = food.calc(g);
  var plate = res.piatto ? `<div class="plate">${plateSvg(res.piatto, food.col)}${esc(res.piatto.testo)}<br>${res.piatto.tipo==='fondo'?'nel piatto fondo':'nel piatto piano'}</div>` : '';
  return `<div class="result">
    <div class="result-head"><span class="tag c-${food.col}">${food.col}</span><b>${esc(food.nome)}</b><span class="g">${g} g</span>${extra||''}</div>
    <div class="result-body"><ul>${res.righe.map(function(t){return '<li>'+esc(t)+'</li>';}).join('')}</ul>${plate}</div>
    <div class="src-note">Misure indicative. Fonti: ${esc(res.fonte)}.</div>
  </div>`;
}

/* ---------- TROVA LA PORZIONE ---------- */
function renderTrova(){
  var html = `<main><p class="intro">1. Scegli l'alimento. 2. Tocca il numero scritto nel tuo schema (sempre a crudo) o scrivilo. 3. Se è una porzione che usi spesso, salvala in Le mie porzioni.</p>`;
  COLORI.forEach(function(col){

    html += `<div class="section-title">${col}</div><div class="colrow">` + list.map(function(f){

    }).join('') + `</div>`;

  var f = foodById(state.food);

function scegli(id){ state.food = (state.food===id?null:id); state.g = null; render(); var p=document.getElementById('pannello'); if(p) p.scrollIntoView({behavior:'smooth',block:'center'}); }

function altro(){ var v = numero(document.getElementById('g_altro').value); if(!v||v<=0){ toast('Scrivi un numero in grammi.'); return; } grammi(Math.round(v)); }
function aggiungi(){

/* ---------- PESA E OSSERVA ---------- */
function getDraft(){

  if(!d){ d = Object.assign({}, CAMPI_VUOTI); d.data = oggi(); var last = load(K_ENTRIES,[]); if(last.length){ d.settimana = last[last.length-1].settimana || ''; } }

}
function setDraft(k,v){ var d=getDraft(); d[k]=v; store(K_DRAFT,d); }
function chipRow(id, opts, val, extraClass){
  return `<div class="chip-group">` + opts.map(function(o){
    var cls = 'chip' + (extraClass?(' col c-'+o):'') + (val===o?' on':'');
    return `<button type="button" class="${cls}" onclick="pick('${id}','${o}')">${esc(o)}</button>`;
  }).join('') + `</div>`;
}
function pick(id,val){ var d=getDraft(); d[id] = (d[id]===val?'':val); store(K_DRAFT,d); render(); }
function scaleField(id,label,hint,val){

    <div class="scale-row"><input type="range" min="0" max="10" step="1" value="${v}" oninput="scale('${id}',this.value)"><span class="scale-val" id="v_${id}">${has?v:'-'}</span></div>
    <div class="scale-desc" id="d_${id}">${has?esc(SCALA[v]):'Sposta il cursore'}</div></div>`;
}
function scale(id,v){ setDraft(id,v); document.getElementById('v_'+id).textContent=v; document.getElementById('d_'+id).textContent=SCALA[v]; flash(); }
function flash(){ var s=document.getElementById('savebar'); if(s){ s.textContent='✓ Salvato su questo telefono'; } }
function renderNuova(){

      <div><label for="f_bil">Bilancia</label><input type="text" inputmode="decimal" id="f_bil" value="${esc(d.bilancia)}" oninput="setDraft('bilancia',this.value);flash()" placeholder="es. 82"></div>

function salva(){
  var d = getDraft();

  var e = Object.assign({}, d); e.id = Date.now().toString(36)+Math.random().toString(36).slice(2,6); e.ts = Date.now();

/* ---------- DIARIO ---------- */
function scarto(e){
  var a=numero(e.stima), b=numero(e.bilancia);
  if(a===null||b===null||b===0) return '';
  var p = Math.round((a-b)/b*100);
  var far = Math.abs(p)>25;
  var testo = p===0 ? 'Centrato in pieno' : (p>0 ? `Stima più alta del ${p}%` : `Stima più bassa del ${Math.abs(p)}%`);
  return `<span class="gap ${far?'far':''}">${testo}</span>`;
}
function dataLabel(s){ try{ return new Date(s+'T12:00:00').toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'}); }catch(e){ return s; } }
function renderDiario(){
  var list = load(K_ENTRIES,[]);
  if(!list.length) return `<main><p class="empty">Non hai ancora salvato nessuna stima. Quando ne salvi una da "Pesa e osserva", la trovi qui.</p></main>`;
  var gruppi = {};
  list.forEach(function(e){ (gruppi[e.data||'senza data'] = gruppi[e.data||'senza data'] || []).push(e); });
  var giorni = Object.keys(gruppi).sort().reverse();
  var vicine = list.filter(function(e){ var a=numero(e.stima),b=numero(e.bilancia); return a!==null&&b!==null&&b!==0&&Math.abs((a-b)/b)<=0.25; }).length;
  var confronti = list.filter(function(e){ return numero(e.stima)!==null&&numero(e.bilancia)!==null&&numero(e.bilancia)!==0; }).length;
  var sintesi = confronti ? `<div class="callout">Hai confrontato <b>${confronti}</b> stime con la bilancia: <b>${vicine}</b> erano entro il 25%. Quando succede quasi sempre, è il momento della prova fuori casa.</div>` : '';
  return `<main>${sintesi}` + giorni.map(function(g,i){
    return `<details class="day" ${i===0?'open':''}><summary>${esc(dataLabel(g))}</summary><div class="day-body">` +
      gruppi[g].map(function(e){
        return `<div class="entry">
          <div class="entry-head"><b>${esc(e.alimento)}</b>${e.colore?`<span class="tag c-${e.colore}">${e.colore}</span>`:''}${e.settimana?`<span class="tag week">${esc(e.settimana)}</span>`:''}${e.pasto?`<span class="tag week">${esc(e.pasto)}</span>`:''}</div>
          ${e.aspetto?`<div class="entry-row">Come appare: ${esc(e.aspetto)}</div>`:''}
          ${(e.stima||e.bilancia)?`<div class="entry-row">Stima: <b>${esc(e.stima||'-')}</b> · Bilancia: <b>${esc(e.bilancia||'-')}</b> ${scarto(e)}</div>`:''}
          ${(e.fame!==''||e.sazieta!=='')?`<div class="entry-row">Fame prima: <b>${e.fame===''?'-':esc(e.fame)}</b> · Sazietà alla fine: <b>${e.sazieta===''?'-':esc(e.sazieta)}</b></div>`:''}
          ${e.note?`<div class="entry-row">Note: ${esc(e.note)}</div>`:''}
          <button class="del" onclick="elimina('${e.id}')">Elimina questa stima</button>
        </div>`;
      }).join('') + `</div></details>`;
  }).join('') + `</main>`;
}
function elimina(id){ if(!confirm('Eliminare questa stima?')) return; store(K_ENTRIES, load(K_ENTRIES,[]).filter(function(e){return e.id!==id;})); render(); }

/* ---------- INVIA ---------- */
function renderInvia(){
  var nome = load(K_NOME,'');
  return `<main>
    <p class="intro">Se vuoi, puoi mandare a Mariastella le tue porzioni e le tue stime prima della prossima call, così ne parlate insieme. Quello che hai scritto resta comunque salvato qui.</p>
    <div class="field"><label for="i_nome">Il tuo nome e cognome</label><input type="text" id="i_nome" value="${esc(nome)}"></div>
    <div class="field"><span class="lbl">Quali stime vuoi includere?</span>
      <div class="chip-group" id="periodo">

        <button type="button" class="chip" data-g="14" onclick="periodo(this)">Ultimi 14 giorni</button>
        <button type="button" class="chip on" data-g="9999" onclick="periodo(this)">Tutto quello che ho scritto</button>
      </div></div>
    <div class="field"><label for="i_nota">Vuoi aggiungere una nota per lei?</label><textarea id="i_nota"></textarea></div>
    <div class="btn-row"><button class="btn" id="i_btn" onclick="invia()">Invia il riepilogo</button></div>
  </main>`;
}
function periodo(b){ document.querySelectorAll('#periodo .chip').forEach(function(c){c.classList.remove('on');}); b.classList.add('on'); }
function invia(){
  var nome = document.getElementById('i_nome').value.trim();
  if(!nome){ toast('Scrivi il tuo nome prima di inviare.'); return; }
  store(K_NOME,nome);
  var g = parseInt(document.querySelector('#periodo .chip.on').getAttribute('data-g'),10);
  var limite = Date.now() - g*86400000;
  var list = load(K_ENTRIES,[]).filter(function(e){ return g>=9999 || (e.ts||0) >= limite; });
  var mie = load(K_MIE,[]), m = load(K_MEST,{});
  if(!list.length && !mie.length){ toast('Non hai ancora porzioni o stime da inviare.'); return; }
  var testoMie = mie.length ? mie.map(function(p){ var f=foodById(p.food); return f ? `${f.nome} [${f.col}] ${p.g} g${p.nota?' ('+p.nota+')':''}` : ''; }).join('\n') : '(nessuna)';
  var testoMest = ['pasta','riso','legumi'].map(function(k){ return m[k] ? `${k}: ${m[k]} g` : ''; }).filter(Boolean).join(' · ') || '(non ancora pesato)';
  var testo = list.length ? list.map(function(e){
    var a=numero(e.stima), b=numero(e.bilancia), s='';
    if(a!==null&&b!==null&&b!==0){ var p=Math.round((a-b)/b*100); s = ` (scarto ${p>0?'+':''}${p}%)`; }
    return `${dataLabel(e.data)} · ${e.pasto||''} · ${e.settimana||''}\n${e.alimento}${e.colore?' ['+e.colore+']':''}\nCome appare: ${e.aspetto||'-'}\nStima: ${e.stima||'-'} · Bilancia: ${e.bilancia||'-'}${s}\nFame prima: ${e.fame===''?'-':e.fame} · Sazietà alla fine: ${e.sazieta===''?'-':e.sazieta}${e.note?'\nNote: '+e.note:''}`;
  }).join('\n\n') : '(nessuna stima nel periodo)';
  var btn = document.getElementById('i_btn'); btn.disabled = true; btn.textContent = 'Invio in corso...';
  fetch('https://formsubmit.co/ajax/pollini-m@hotmail.com', {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'Accept':'application/json' },
    body: JSON.stringify({
      _subject: `Riepilogo Occhiometro - ${nome}`,
      _captcha: 'false',
      Nome: nome,
      Porzioni: testoMie,
      Mestoli: testoMest,
      Periodo: g>=9999 ? 'Tutto quello che ha scritto' : `Ultimi ${g} giorni`,
      Nota: document.getElementById('i_nota').value.trim() || '(nessuna)',
      Stime: testo
    })
  }).then(function(r){ if(!r.ok) throw new Error('x'); return r.json(); })
  .then(function(){
    document.getElementById('app').innerHTML = `<main><h2>Riepilogo inviato</h2><p class="intro">Mariastella lo riceverà prima della vostra prossima call. A presto.</p><div class="btn-row"><button class="btn" onclick="go('trova')">Torna all'Occhiometro</button></div></main>`;
  }).catch(function(){
    btn.disabled = false; btn.textContent = 'Invia il riepilogo';
    toast('Non sono riuscita a inviarlo. Controlla la connessione e riprova.');
  });
}

/* ---------- FONTI ---------- */
