<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guida alle uscite</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #efe6dc;
    font-family: Georgia, 'Times New Roman', serif;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 16px 0 48px;
  }
  .page {
    display: block;
    width: 100%;
    background: #fff;
  }
  .page-block {
    position: relative;
    margin-bottom: 6px;
    box-shadow: 0 1px 6px rgba(0,0,0,0.08);
  }
  .cta-link {
    position: absolute;
    left: 13.53%;
    top: 52.0%;
    width: 73.75%;
    height: 6.1%;
    cursor: pointer;
  }
  .section-bar {
    margin: 28px 16px 14px;
    text-align: center;
  }
  .section-bar h2 {
    font-family: Georgia, serif;
    color: #4d3a2e;
    font-size: 22px;
    margin: 0 0 4px;
  }
  .section-bar span {
    color: #8a7566;
    font-size: 13px;
    letter-spacing: 0.02em;
  }
  .video-wrap {
    margin: 0 16px 24px;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid #d8cabb;
    background: #000;
    box-shadow: 0 1px 6px rgba(0,0,0,0.08);
  }
  .video-wrap video {
    display: block;
    width: 100%;
    height: auto;
  }
</style>
</head>
<body>
  <div class="wrap">

    <img class="page" src="page01.jpg" alt="">
    <img class="page" src="page02.jpg" alt="">
    <img class="page" src="page03.jpg" alt="">
    <img class="page" src="page04.jpg" alt="">
    <img class="page" src="page05.jpg" alt="">
    <img class="page" src="page06.jpg" alt="">
    <img class="page" src="page07.jpg" alt="">
    <img class="page" src="page08.jpg" alt="">
    <img class="page" src="page09.jpg" alt="">
    <img class="page" src="page10.jpg" alt="">
    <img class="page" src="page11.jpg" alt="">
    <img class="page" src="page12.jpg" alt="">
    <img class="page" src="page13.jpg" alt="">
    <img class="page" src="page14.jpg" alt="">
    <img class="page" src="page15.jpg" alt="">

    <div class="page-block">
      <img class="page" src="page16.jpg" alt="">
      <a class="cta-link" href="https://calendly.com/pollini-m/30min" target="_blank" rel="noopener" aria-label="Prenota la tua call conoscitiva"></a>
    </div>

    <img class="page" src="page17.jpg" alt="">

    <div class="section-bar">
      <h2>Cosa dicono del percorso</h2>
      <span>Le voci di chi lo ha vissuto</span>
    </div>

    <div class="video-wrap">
      <video controls preload="metadata">
        <source src="video.mp4" type="video/mp4">
        Il tuo browser non supporta la riproduzione video.
      </video>
    </div>

  </div>
</body>
</html>
